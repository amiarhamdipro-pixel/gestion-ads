version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Mineures et correctives regroupées en une seule PR ;
      # les majeures restent hors groupe, donc en PR séparées.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
